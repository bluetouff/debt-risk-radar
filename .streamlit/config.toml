[browser]
gatherUsageStats = false

[server]
address = "127.0.0.1"
port = 8501
headless = true
enableXsrfProtection = true
enableCORS = true
maxUploadSize = 1
fileWatcherType = "none"

[client]
toolbarMode = "minimal"
showErrorDetails = "none"

[theme]
base = "dark"
primaryColor = "#5eead4"
backgroundColor = "#0c0d10"
secondaryBackgroundColor = "#121419"
textColor = "#e7e9ee"
font = "monospace"
